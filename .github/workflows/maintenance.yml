name: Maintenance (lockfile + lint fix)

# Manually triggered: regenerates package-lock.json and applies eslint/prettier auto-fixes.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Generate lockfile
        run: npm install --no-audit --no-fund
      - name: Auto-fix lint
        run: npx eslint -c eslint.config.mjs . --fix || true
      - name: Show remaining lint problems
        run: npx eslint -c eslint.config.mjs . || true
      - name: Run unit tests
        run: npm run test:js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: add package-lock.json and apply lint fixes"
          git push
